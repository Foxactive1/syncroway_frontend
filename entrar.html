<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#6038e8"
  >

  <meta
    name="description"
    content="Acesse sua conta SyncroWay de cliente, lojista, prestador, motorista ou administrador."
  >

  <meta name="robots" content="noindex,nofollow">

  <title>
    Entrar ou criar conta — SyncroWay
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <link
    href="./css/app.css"
    rel="stylesheet"
  >
</head>

<body>

  <a
    href="#main-content"
    class="sw-skip-link"
  >
    Ir para o conteúdo
  </a>


  <div id="sw-header"></div>


  <main
    id="main-content"
    class="container py-4"
  >

    <div
      id="sw-forms"
      class="row g-3 justify-content-center"
    >

      <!-- LOGIN -->

      <div
        class="
          col-12
          col-md-6
          col-lg-5
        "
      >

        <section
          class="sw-panel p-4 h-100"
          aria-labelledby="sw-login-title"
        >

          <h1
            id="sw-login-title"
            class="h5 mb-3"
          >
            Entrar
          </h1>


          <form
            id="sw-login"
            class="row g-3"
            autocomplete="on"
          >

            <div class="col-12">

              <label
                class="form-label small"
                for="sw-login-email"
              >
                E-mail
              </label>

              <input
                id="sw-login-email"
                name="email"
                type="email"
                class="form-control"
                autocomplete="email"
                inputmode="email"
                required
              >

            </div>


            <div class="col-12">

              <label
                class="form-label small"
                for="sw-login-password"
              >
                Senha
              </label>

              <input
                id="sw-login-password"
                name="password"
                type="password"
                class="form-control"
                autocomplete="current-password"
                required
              >

            </div>


            <div class="col-12">

              <button
                class="btn btn-primary w-100"
                type="submit"
              >
                Entrar
              </button>

            </div>

          </form>

        </section>

      </div>


      <!-- CADASTRO -->

      <div
        class="
          col-12
          col-md-6
          col-lg-5
        "
        id="cadastro"
      >

        <section
          class="sw-panel p-4 h-100"
          aria-labelledby="sw-register-title"
        >

          <h2
            id="sw-register-title"
            class="h5 mb-3"
          >
            Criar conta de cliente
          </h2>


          <form
            id="sw-register"
            class="row g-3"
            autocomplete="on"
          >

            <div class="col-12">

              <label
                class="form-label small"
                for="sw-register-name"
              >
                Nome
              </label>

              <input
                id="sw-register-name"
                name="name"
                type="text"
                class="form-control"
                autocomplete="name"
                required
              >

            </div>


            <div class="col-12">

              <label
                class="form-label small"
                for="sw-register-email"
              >
                E-mail
              </label>

              <input
                id="sw-register-email"
                name="email"
                type="email"
                class="form-control"
                autocomplete="email"
                inputmode="email"
                required
              >

            </div>


            <div class="col-12 col-sm-6">

              <label
                class="form-label small"
                for="sw-register-phone"
              >
                Telefone
              </label>

              <input
                id="sw-register-phone"
                name="phone"
                type="tel"
                class="form-control"
                autocomplete="tel"
                inputmode="tel"
                placeholder="(00) 00000-0000"
              >

            </div>


            <div class="col-12 col-sm-6">

              <label
                class="form-label small"
                for="sw-register-password"
              >
                Senha
              </label>

              <input
                id="sw-register-password"
                name="password"
                type="password"
                minlength="8"
                class="form-control"
                autocomplete="new-password"
                aria-describedby="sw-password-help"
                required
              >

              <div
                id="sw-password-help"
                class="form-text"
              >
                Use pelo menos 8 caracteres.
              </div>

            </div>


            <div class="col-12">

              <button
                class="btn btn-dark w-100"
                type="submit"
              >
                Criar conta
              </button>

            </div>

          </form>


          <p
            class="
              text-muted
              small
              mt-3
              mb-0
            "
          >
            Contas de lojista, prestador,
            motorista e administrador são
            criadas pela administração.
          </p>

        </section>

      </div>

    </div>


    <!-- ======================================================
         CONFIGURAÇÃO DA API
         Ambiente de desenvolvimento
         ====================================================== -->

    <div
      class="
        row
        justify-content-center
        mt-4
      "
    >

      <div
        class="
          col-12
          col-lg-10
        "
      >

        <section
          class="sw-panel p-3 small"
          aria-labelledby="sw-api-title"
        >

          <div
            class="
              d-flex
              flex-column
              flex-md-row
              justify-content-between
              gap-3
              align-items-md-center
            "
          >

            <div>

              <span
                id="sw-api-title"
                class="fw-semibold"
              >
                API conectada:
              </span>

              <code id="sw-api-base"></code>

            </div>


            <form
              id="sw-api-form"
              class="
                d-flex
                flex-column
                flex-sm-row
                gap-2
              "
            >

              <label
                class="sw-sr-only"
                for="sw-api-input"
              >
                Endereço da API
              </label>

              <input
                id="sw-api-input"
                class="form-control form-control-sm sw-api-input"
                type="url"
                placeholder="https://sua-api.com/api"
                autocomplete="url"
              >

              <button
                class="
                  btn
                  btn-sm
                  btn-outline-secondary
                "
                type="submit"
              >
                Trocar
              </button>

            </form>

          </div>

        </section>

      </div>

    </div>

  </main>


  <div id="sw-footer"></div>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script src="./runtime-config.js"></script>
  <script
    type="module"
    src="./js/entrar.js"
  ></script>

</body>
</html>
