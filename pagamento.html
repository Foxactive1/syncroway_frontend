<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <!-- Unificado com index/produto/painel -->
  <meta
    name="theme-color"
    content="#321078"
  >

  <meta
    name="description"
    content="Acompanhe e conclua o pagamento dos seus pedidos SyncroWay."
  >

  <!-- Página privada com IDs de pedido na query string:
       nunca indexar, nunca seguir. -->
  <meta name="robots" content="noindex,nofollow">

  <title>Pagamento e pedidos — SyncroWay</title>

  <!-- Abre conexão com o CDN antes do CSS -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <link
    href="./css/app.css"
    rel="stylesheet"
  >
</head>

<body>

  <a href="#main-content" class="sw-skip-link">Ir para o conteúdo</a>

  <div id="sw-header"></div>


  <main
    id="main-content"
    class="container py-4"
  >

    <h1 class="h4">Pagamento e acompanhamento</h1>

    <p class="text-muted">
      Cada loja gera um pedido e uma cobrança. O pagamento só é
      confirmado após retorno do gateway.
    </p>


    <!-- Sem aria-live aqui: o pagamento.js substitui o conteúdo
         inteiro a cada poll (15s) — uma live region neste
         container re-anunciaria todos os pedidos continuamente.
         O anúncio de mudança de status vai para #sw-payment-status. -->
    <div
      id="sw-payments"
      aria-busy="true"
    >
      Carregando pedidos…
    </div>


    <!-- Região viva dedicada a anúncios curtos:
         "Status de pagamento atualizado." quando o poll detecta
         mudança, sem re-navegar pelo conteúdo inteiro. -->
    <div
      id="sw-payment-status"
      class="sw-sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>


    <a
      href="./painel.html"
      class="btn btn-outline-primary mt-3"
    >
      <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
      Voltar ao painel
    </a>

  </main>


  <div id="sw-footer"></div>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script src="./runtime-config.js"></script>

  <script
    type="module"
    src="./js/pagamento.js"
  ></script>

</body>
</html>
