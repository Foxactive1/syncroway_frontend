<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#6038e8"
  >

  <meta
    name="description"
    content="Revise os produtos escolhidos e finalize a compra no SyncroWay."
  >

  <title>
    Carrinho — SyncroWay
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <link
    href="./css/app.css"
    rel="stylesheet"
  >
</head>

<body>

  <a
    href="#main-content"
    class="sw-skip-link"
  >
    Ir para o conteúdo
  </a>


  <div id="sw-header"></div>


  <main
    id="main-content"
    class="container py-4"
  >

    <section
      id="sw-cart"
      aria-live="polite"
      aria-busy="false"
      aria-label="Carrinho de compras"
    ></section>

  </main>


  <div id="sw-footer"></div>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script src="./runtime-config.js"></script>
  <script
    type="module"
    src="./js/carrinho.js"
  ></script>

</body>
</html>
