<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <!-- Unificado com index/produto/painel/pagamento/entrar/checkout -->
  <meta
    name="theme-color"
    content="#321078"
  >

  <meta
    name="description"
    content="Revise os produtos escolhidos e finalize a compra no SyncroWay."
  >

  <meta name="robots" content="noindex,nofollow">

  <title>
    Carrinho — SyncroWay
  </title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <link
    href="./css/app.css"
    rel="stylesheet"
  >
</head>

<body>

  <a href="#main-content" class="sw-skip-link">Ir para o conteúdo</a>

  <div id="sw-header"></div>


  <main
    id="main-content"
    class="container py-4"
  >

    <!-- SEM aria-live aqui.

         carrinho.js reescreve este container a cada mudança
         de quantidade. Uma live region aqui anunciaria o
         carrinho INTEIRO a cada +/- de item — verboso e
         atrapalha o usuário que está editando outra linha.

         Anúncios de "Quantidade atualizada", "Item removido"
         vão para #sw-cart-status (região dedicada, curta).

         aria-busy="true" inicial: JS seta false ao terminar. -->
    <section
      id="sw-cart"
      aria-busy="true"
      aria-label="Carrinho de compras"
    ></section>


    <!-- Região viva para mensagens curtas e não intrusivas. -->
    <div
      id="sw-cart-status"
      class="sw-sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

  </main>


  <div id="sw-footer"></div>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script src="./runtime-config.js"></script>

  <script
    type="module"
    src="./js/carrinho.js"
  ></script>

</body>
</html>
