<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <!-- Unificado com index/produto/painel/pagamento/entrar -->
  <meta
    name="theme-color"
    content="#321078"
  >

  <meta
    name="description"
    content="Informe endereço e forma de pagamento para concluir seu pedido SyncroWay."
  >

  <meta name="robots" content="noindex,nofollow">

  <title>
    Checkout — SyncroWay
  </title>

  <!-- CDN: abre conexão antes do CSS -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <link
    href="./css/app.css"
    rel="stylesheet"
  >
</head>

<body>

  <a href="#main-content" class="sw-skip-link">Ir para o conteúdo</a>

  <div id="sw-header"></div>


  <main
    id="main-content"
    class="container py-4"
  >

    <!-- Container principal — SEM aria-live.

         O checkout.js reescreve este nó inteiro em dois momentos:
         no load (renderiza o form completo com itens, frete e
         endereço) e após o submit (tela de sucesso). Uma live
         region aqui anunciaria o formulário inteiro a cada render,
         duplicando a leitura normal da página.

         aria-busy="true" inicial: o JS seta false ao terminar o
         load e ao terminar o submit. Começar em false faria o SR
         tratar o container vazio como "pronto e vazio". -->
    <section
      id="sw-checkout"
      aria-busy="true"
      aria-label="Finalização do pedido"
    ></section>


    <!-- Região viva dedicada a anúncios curtos:
         "Pedido criado com sucesso.", "Forma de pagamento
         indisponível. Atualize a página.". Sem re-navegar
         pelo conteúdo do container principal. -->
    <div
      id="sw-checkout-status"
      class="sw-sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

  </main>


  <div id="sw-footer"></div>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script src="./runtime-config.js"></script>

  <script
    type="module"
    src="./js/checkout.js"
  ></script>

</body>
</html>
