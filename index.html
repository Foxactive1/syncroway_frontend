<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#6038e8"
  >

  <meta
    name="description"
    content="Compre produtos e contrate serviços das lojas e prestadores da sua região no SyncroWay."
  >

  <title>
    SyncroWay — Marketplace de produtos e serviços
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <link
    href="/app/css/app.css"
    rel="stylesheet"
  >
</head>

<body>

  <a
    href="#main-content"
    class="sw-skip-link"
  >
    Ir para o conteúdo
  </a>


  <div id="sw-header"></div>


  <main
    id="main-content"
    class="container py-4"
  >

    <section
      class="sw-hero p-4 p-md-5 mb-4"
      aria-labelledby="sw-hero-title"
    >

      <h1
        id="sw-hero-title"
        class="h3 fw-bold mb-2"
      >
        Tudo da sua cidade, em um só lugar
      </h1>

      <p class="mb-3">
        Produtos entregues por motoristas parceiros
        e serviços com agenda confirmada.
      </p>

      <div
        class="d-flex gap-2 flex-wrap"
        aria-label="Filtrar catálogo por tipo"
      >

        <button
          class="btn btn-dark btn-sm"
          type="button"
          data-type="product"
        >
          Ver produtos
        </button>

        <button
          class="btn btn-outline-dark btn-sm"
          type="button"
          data-type="service"
        >
          Ver serviços
        </button>

        <button
          class="btn btn-outline-dark btn-sm"
          type="button"
          data-type=""
        >
          Ver tudo
        </button>

      </div>

    </section>


    <section
      aria-labelledby="sw-heading"
    >

      <div
        id="sw-categories"
        class="d-flex gap-2 overflow-auto pb-3"
        aria-label="Categorias"
      ></div>


      <h2
        id="sw-heading"
        class="h5 fw-semibold my-3"
      >
        Ofertas de hoje
      </h2>


      <div
        id="sw-grid"
        class="row g-3"
        aria-live="polite"
        aria-busy="false"
      ></div>

    </section>

  </main>


  <div id="sw-footer"></div>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script
    type="module"
    src="/app/js/home.js"
  ></script>

</body>
</html>
