<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#6038e8"
  >

  <meta
    name="description"
    content="Veja produtos e serviços no SyncroWay, consulte preços, estoque e faça compras ou agendamentos."
  >

  <title>Detalhes do item — SyncroWay</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <!-- SyncroWay -->
  <link
    href="/app/css/app.css"
    rel="stylesheet"
  >
</head>


<body>

  <!-- Header global -->
  <div id="sw-header"></div>


  <main
    class="container py-4"
    id="main-content"
  >

    <nav
      class="mb-3 small"
      aria-label="Navegação estrutural"
    >
      <a
        href="/app/index.html"
        class="text-decoration-none"
      >
        <i
          class="bi bi-chevron-left"
          aria-hidden="true"
        ></i>

        Voltar ao catálogo
      </a>
    </nav>


    <!-- Conteúdo carregado por produto.js -->
    <section
      id="sw-detail"
      aria-live="polite"
    ></section>

  </main>


  <!-- Footer global -->
  <div id="sw-footer"></div>


  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Página -->
  <script
    type="module"
    src="/app/js/produto.js"
  ></script>

</body>
</html>
