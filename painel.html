<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <!-- Unificado com index.html e produto.html -->
  <meta
    name="theme-color"
    content="#321078"
  >

  <meta
    name="description"
    content="Acompanhe pedidos, agendamentos, vendas, entregas e indicadores no painel SyncroWay."
  >

  <!-- Painel autenticado: nunca indexar -->
  <meta name="robots" content="noindex,nofollow">

  <title>
    Painel — SyncroWay
  </title>

  <!-- Abre conexão com o CDN antes do CSS (~200ms em mobile) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <link
    href="./css/app.css"
    rel="stylesheet"
  >
</head>

<body>

  <a
    href="#main-content"
    class="sw-skip-link"
  >
    Ir para o conteúdo
  </a>


  <div id="sw-header"></div>


  <main
    id="main-content"
    class="container py-4"
  >

    <!-- Shell do painel.
         Sem aria-live/aria-busy aqui: o painel.js injeta
         #sw-body com sua própria região viva (aria-live+aria-busy),
         que é o único local onde o conteúdo realmente troca
         (ao mudar de aba). Ter live region no container externo
         fazia o SR anunciar o shell inteiro + o conteúdo em
         sequência no boot — dois anúncios verbosos. -->
    <section
      id="sw-panel"
      aria-label="Painel SyncroWay"
    ></section>

  </main>


  <div id="sw-footer"></div>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script src="./runtime-config.js"></script>

  <script
    type="module"
    src="./js/painel.js"
  ></script>

</body>
</html>
